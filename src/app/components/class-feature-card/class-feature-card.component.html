<p-accordion [value]="[0]" [multiple]="false" class="features-accordion">
  <p-accordion-panel [value]="index" class="feature-panel">
    <p-accordion-header>
      <div class="feature-header">
        <div class="feature-header-left">
          <h3 class="feature-name">{{ feature.name }}</h3>
        </div>
        <div class="feature-header-badges">
          <span
            class="badge badge-class"
            [style.background-color]="getClassColorVar()"
            [attr.data-class]="getNormalizedClassName()"
          >
            {{ feature.className }}
          </span>
          @if (feature.subclassShortName != null) {
            <span
              class="badge badge-class"
              [style.background-color]="getClassColorVar()"
              [attr.data-class]="getNormalizedClassName()"
            >
              {{ feature.subclassShortName }}
            </span>
          }
          <span class="badge badge-level">Level {{ feature.level }}</span>
          <span class="badge badge-source">{{ feature.source }}</span>
        </div>
      </div>
    </p-accordion-header>

    <p-accordion-content>
      <div class="feature-content">
        <div class="entry-text" [innerHTML]="content"></div>
      </div>
    </p-accordion-content>
  </p-accordion-panel>
</p-accordion>
